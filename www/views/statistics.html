<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container{
            padding: 10px;
        }
        #hero{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            gap: 10px;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }
        p{
            opacity: .6;
        }
        .svg-stat-ring{
            transform: rotate(180deg);
        }
        .info-content{
            position: absolute;
            top: 70%;
            text-align: center;
        }
        .info-content h2{
            margin: 0;
        }
    </style>

</head>
<body>
    <div class="container">
        <header>
            <button class="navigation-btn"><a href="./homePage.html">&#60;</a></button>
            <h4>Statistiques</h4>
        </header>
        <main>
            <section id="hero">
                <p>Il semble que ce qui compte</p> <p>Occupe</p>
                <svg class="svg-stat-ring" width="300" height="150">
                    <circle id="stat-ring" stroke="white" stroke-width="6" fill="transparent" r="140" cx="150"></circle>
                </svg>
                <div class="info-content">
                    <h2><span class="percentage">100</span>%</h2>
                    <p>De votre temps</p>
                </div>
            </section>
            <section id="general-container">
                <div id="general-graphe"></div>
            </section>
        </main>
    </div>
    <script src="../models/settings.js"></script>
    <script type="module">
        import { StorageDB } from "../models/data.js";
        import { SerieStatistique } from "../models/SerieStatistique.js";
        import { createElement } from "../models/processing.js";
        import { Timer } from "../models/TimerManager.js";
        const db = new StorageDB("flowRecord")
        let data = await db.all()
        while (data.length === 0 || !data) {
            data = await db.all()
        }

        const generalData = data.map(task => {
            const label = task.label ? task.label : task.taskName.slice(0, 5)
            return {valeur: 1, effectif: totalTime(task.sessions), label: label}
        })

        function totalTime(sessions) {
            let totalTime = 0
            sessions.forEach(session => {
                totalTime += session.timeMs / 1000
            });
            return totalTime
        }
        
        let gdEnd = generalData.length > 4 ? 4 : generalData.length 
        const GeneralStat = new SerieStatistique(generalData.slice(0, gdEnd), {type: "discrete", titre:" Le top de vos activités"})
        
        GeneralStat.renderGraphique("#general-graphe", 'batons')

        // Stat pour chaque tache de facon individuelle
        data.forEach((d, idx) => {
            const thisId = `sect-${d.taskName[0]}-${idx}`
            const section = createElement("section", {id: thisId})
            const compteur = d.sessions.reduce((acc, s) =>{
                acc[s.date.slice(0, 10)] = (acc[s.date.slice(0, 10)] || 0) + 1;
                return acc;
            }, {}) // {"2026-09-24": 3, "2026-09-20": 2, ...}

            const dataArray =[]
            for (const [key, value] of Object.entries(compteur)) {
                const date = new Date(key)
                const label = Timer.getRelativeDateLabel(key)
                dataArray.push({valeur: 1, effectif: value, label: label})
            }

            if(dataArray.length === 0) return
            document.querySelector("main").append(section)

            const thisStat = new SerieStatistique(dataArray, {type: "discrete", titre: d.taskName})
            thisStat.renderGraphique(`#${thisId}`, 'polygone')
        });

    </script>
</body>
</html>
