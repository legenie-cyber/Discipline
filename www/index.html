<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discipline</title>
    <link rel="stylesheet" href="./views/style.css">
    <script type="module" src="./main.js"></script>
    <script>
        if (localStorage.getItem("_id")) {
            location.assign("./views/homePage.html") 
        }
    </script>
    <style>
        .container{
            font-weight: 700;
        }

        form{
            padding: .7rem;
        }
        button[type="submit"]{
            position: fixed;
            top: 80%;
            margin-top: 1rem;
            background-color: black;
        }
        .next{
            background-color: blue;
            color: whitesmoke;
        }
        section{
            height: 100vh;
            display: flex;
            justify-content: center;
            flex-direction: column;
            gap: 2rem;
            align-items: center;
            display: none;
        }
        .active{
            display: flex;
        }
        h3{
            margin: 15px;
        }
        label{
            border: none;
            text-align: center;
        }
        label:first-child{
            text-align: left;
        }
        input::placeholder{
            font-weight: 800;
        }
        input{
            margin: 10px auto;
        }
        input[type="email"]{
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.18);
            color: inherit;
            padding: 0.95rem 1rem;
            outline: none;
        }
        #me{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        div.carrousel{
            /* display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); */
            gap: 30px;
            margin: 10px auto;
            
        }
        div.carrousel > *{
            height: 140px;
            padding: 0;
            position: relative;
            opacity: .6;
            transition: opacity .5s ease;
        }
        .theme:first-child{
            background-color: rgba(255, 255, 255, 0.9);
        }
        .theme:last-child{
            background-color: rgba(0, 0, 0, 0.8);
        }
        
        .active{
            opacity: 1 !important;
        }

        div.carrousel article .title{
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 10px;
            background-color: rgba(164, 162, 162, 0.757);
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(0, 0, 0, .2);
        } 
        .color[data-color="violet"]{
            background: violet;
        }
        .color[data-color="yellow"]{
            background: yellow;
        }
        .color[data-color="pink"]{
            background: pink;
        }
        .color[data-color="green"]{
            background: green;
        }
        .color[data-color="blue"]{
            background: blue;
        }
        .color[data-color="red"]{
            background: red;
        }
        .buttons{
            display: flex;
            gap: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- <section id="greeting" data-step="0" class=" step">
            <button onclick= "showSection('name', 'greeting')" class="next">Suivant</button>

        </section> -->

        <section id="name" data-step="1" class="active step">
            <label>Salut! 
                <br>En quelques étapes, nous allons créer ton compte.
            </label>
            <Label>Commençons par votre prénom</Label>
            <input type="text" placeholder="James" id="name" required>
            <button data-nextId="slug" data-currentId="name" class="next">Suivant</button>
        </section>

        <section id="slug" data-step="2" class="step">
            <label>Choisissez un slug</label>
            <input type="text" placeholder="Slug" id="slug" maxlength="10">
            <select>
                <option value="">Aucun</option>
                <option value="Hi">Hi</option>
                <option value="Hi There">Hi There</option>
                <option value="Salut">Salut</option>
                <option value="On y va">On y va</option>
                <option value="Slug">Slug</option>
            </select>
            <div class="buttons">
                <button data-previd="name" class="prev">Retour</button>
                <button data-nextId="email" data-currentId="slug" class="next">Suivant</button>
            </div>

        </section>

        <section id="email" data-step="3" class="step">
            <label>Maintenant entrez une email pour garder vos données</label>
            <input type="email" required placeholder="Jane@gmail.com">
            <div class="buttons">
                <button  data-previd="slug" class="prev">Retour</button>
                <button  data-nextId="theme" data-currentId="email" class="next">Suivant</button>
            </div>
        </section>

        <section id="theme" data-step="4" class="step">
            <label>Quel thème préferez-vous?</label>
            <div class="theme-switcher carrousel">
                <button type="button" class="theme" data-theme="day">Jour</button>
                <button type="button" class="theme" data-theme="night">Nuit</button>
            </div>
            <input type="text" name="" id="theme" style="display: none;">
            <div class="buttons">
                <button  data-previd="email" class="prev">Retour</button>
                <button data-nextId="end" data-currentId="theme" class="next">Suivant</button>
            </div>
        </section>

        <section id="end">
            <!-- <p >Félicitatioin! Votre compte a été bien crée. Maintenant vous pouvez commencer a utiliser</p> -->
        </section>
    </div>
    <script src="./models/settings.js" type="module"></script>
    <script type="module">
        import { NotificationsManager } from './models/notifications.js';
        import { FestiveUI } from "./models/festiveUi.js";
        import { createUser } from "./models/meta.js";
        import { initAlarmes } from "./models/nativeAlarm.js";

        const ui = new FestiveUI()
        const notification = new NotificationsManager({actionType: "TAP_TYPE" })
        const nextBtns = document.querySelectorAll(".next")
        const prevBtns = document.querySelectorAll(".prev")

        const handleSlug = ()=>{
            const slugInput = document.querySelector("input#slug")
            const slugSelect = document.querySelector("select")
            slugSelect.addEventListener("change", (e)=>{
                slugInput.value = e.target.value
            })
        }
        document.querySelectorAll(".theme").forEach((btn, id, array) => {
            btn.addEventListener("click", ev => {
                array.forEach(b => b.style.opacity = .6)
                document.querySelector("input#theme").value = ev.currentTarget.dataset.theme
                ev.currentTarget.style.opacity = 1
                
            })
        })
        const showSection = async function(nextId, currentId) {
            const current = document.querySelector(`#${currentId}`)
            const next = document.querySelector(`#${nextId}`)
            const name = document.querySelector("input#name").value
            const slug = document.querySelector("input#slug").value
            const email = document.querySelector("input[type='email']").value
            const theme = document.querySelector("input#theme").value


            if (currentId === "name") {
                if (!name || name.length < 2) {
                    ui.popup("Oups le nom n'est pas valide", { type: "error" })
                    return
                }
            }if (currentId === "slug") {
                if (!slug || slug.length < 2) {
                    ui.popup("Il semblerait que vous n'avez pas choisi de slug", { type: "error" })
                    return
                }
            } else if (currentId === "email") {
                if (!email || !email.includes("@")) {
                    ui.popup("Oups l'email n'est pas valide", { type: "error" })
                    return
                }
            }else if(currentId === "theme"){
                if(!theme){
                    ui.popup("Oups vous n'avez pas choisi de thème", { type: "error" })
                    return
                }
                await notificationsInit()
                try {
                    await createUser({ me: { subName: name, slug, email }, theme: { mode: theme } })
                    ui.confettis()
                    await ui.alert("Félicitatioin! Votre compte a été bien crée. Maintenant vous pouvez commencer a utiliser", {title: "Terminé"})
                    console.warn("Redirection vers la page d'accueil")
                    location.assign("./views/homePage.html")
                } catch (error) {
                    console.error("Erreur lors de la création du compte", error)
                }
            }
            
            document.querySelector(".active").classList.remove("active")
            next.classList.add("active")
        }

        handleSlug()
        nextBtns.forEach(btn => {
            btn.addEventListener("click", async ev  => {
                const nextId = ev.currentTarget.dataset.nextid
                const currentId = ev.currentTarget.dataset.currentid
                await showSection(nextId, currentId)
            })
        })
        prevBtns.forEach(btn => {
            btn.addEventListener("click", async ev  => {
                const prevId = ev.currentTarget.dataset.previd
                await showSection(prevId)
            })
        })
        
        
        const notificationsInit = async ()=>{
            await ui.alert("Autorisez les notifications pour que nous puissions vous faire des rappel en temps réel", { title: 'Notifications', type: 'info' });

            initAlarmes()
            alert("Alarme initialisée")
            await notification.init()
            alert("Notifications initialisées")
            notification.onAction = (ev) => {
                if (ev.type === 'tap') {
                    window.location.href = './views/homePage.html'
                } else if (ev.type === 'reply') {
                    window.location.href = './views/homePage.html'
                }
            }
            notification.sendNow({title: "Plus qu'un partenaire de route", body:"Bienvenue sur discipline \n Nous vous offrons une interface intuitive et optimisée pour vous aider à mieux gerer votre temps."})
        }

        async function autoTtest() {
            const record = await createUser({ me: { subName: "name", slug:"slug", email:"email" }, theme: { mode: "day" } })
            console.log(record)
            location.assign("./views/homePage.html")
        }

    </script>
    
</body>
</html>
