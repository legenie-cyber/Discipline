# Project-wide Gradle settings.

# Force le mode hors-ligne pour empêcher Gradle de se connecter à internet
org.gradle.offline=true

# Optimisations de mémoire et de performance
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.daemon=true
org.gradle.parallel=true

# Évite de recalculer le graphe de dépendances si rien n'a changé
org.gradle.configuration-cache=true
org.gradle.caching=true

# Accélère la détection des changements de fichiers
org.gradle.vfs.watch=true

# AndroidX package structure
android.useAndroidX=true
